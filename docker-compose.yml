services:
  raven2-ambf:
    build:
      context: .
      network: host   # cloning AMBF over the default bridge network is unreliable on WSL2
    network_mode: host
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    gpus: all
