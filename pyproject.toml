[project]
name = "raven2-ambf-crtk"
version = "0.1.0"
description = "CRTK API adapter for the AMBF RAVEN-II simulation"
readme = "README.md"
# ROS Noetic ships C extensions (e.g. tf2_py) built for CPython 3.8.
requires-python = "==3.8.*"
# rospy, tf, ambf_client and the message packages come from ROS via PYTHONPATH
# (source /opt/ros/noetic/setup.bash and your catkin devel/setup.bash first).
# pyyaml and rospkg are their runtime deps, which apt would otherwise provide;
# transformations is imported by AMBF 2.0's ambf_client.
dependencies = [
    "numpy",
    "pyyaml",
    "rospkg",
    "transformations>=2022.9.26",
]

[project.scripts]
raven2-ambf-crtk = "raven2_ambf_crtk.adapter.main:start"
raven-keyboard = "raven2_ambf_crtk.keyboard.keyboard_controller:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.uv]
# Use the system Python 3.8 that ROS Noetic is built against.
python-preference = "only-system"
